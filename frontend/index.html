<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF &amp; Screenshot</title>
    <!-- ... (mantén el estilo como antes) ... -->
</head>
<body>
    <!-- ... (HTML igual que antes, incluyendo el contenedor de PayPal) ... -->

    <!-- SDK de PayPal con onload para asegurar que esté disponible -->
    <script src="https://www.sandbox.paypal.com/sdk/js?client-id=AbpZBPpiJcR_ObHsh3t&vault=true&intent=subscription"></script>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        // 👇 CAMBIA ESTO A LA URL DE TU BACKEND EN RENDER
        const API_BASE = 'https://pdf-api-k6f8.onrender.com/api';
        // ============================================================

        // ... (todos los demás elementos DOM y funciones existentes) ...

        // ============================================================
        // RENDERIZAR BOTÓN DE PAYPAL (solo cuando el SDK esté listo)
        // ============================================================
        let payPalReady = false;

        function onPayPalLoaded() {
            payPalReady = true;
            console.log('✅ SDK de PayPal cargado correctamente');
            // Si el contenedor de PayPal ya está visible, renderiza el botón
            if (!paypalContainer.classList.contains('hidden')) {
                renderPayPalButton();
            }
        }

        function renderPayPalButton() {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = ''; // Limpiar botones anteriores

            if (!authToken) {
                showStatus('⚠️ Inicia sesión para mejorar tu plan', true);
                return;
            }

            if (!payPalReady) {
                showStatus('⏳ Cargando PayPal, por favor espera...', false);
                // Intentar de nuevo en 1 segundo
                setTimeout(renderPayPalButton, 1000);
                return;
            }

            if (typeof paypal === 'undefined') {
                showStatus('⚠️ No se pudo cargar PayPal. Intenta recargar la página.', true);
                return;
            }

            paypal.Buttons({
                style: {
                    shape: 'pill',
                    color: 'blue',
                    layout: 'vertical',
                    label: 'subscribe'
                },
                createSubscription: function(data, actions) {
                    return actions.subscription.create({
                        plan_id: 'P-28D036507E673490PNKBC7LQ' // Reemplaza con tu Plan ID real
                    });
                },
                onApprove: function(data, actions) {
                    const subscriptionID = data.subscriptionID;
                    showStatus('⏳ Procesando tu suscripción...', false);

                    fetch(`${API_BASE}/paypal/subscription-activated`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({ subscriptionID })
                    })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => { throw new Error(err.error || 'Error al procesar la suscripción'); });
                        }
                        return response.json();
                    })
                    .then(data => {
                        showStatus('✅ ¡Suscripción activada! Ahora eres Premium.', false);
                        userPlanBadge.textContent = '⭐ Premium';
                        upgradeLink.classList.add('hidden');
                        paypalContainer.classList.add('hidden');
                        // Recargar para actualizar completamente el estado
                        setTimeout(() => {
                            window.location.reload();
                        }, 2000);
                    })
                    .catch(error => {
                        console.error('Error al activar suscripción:', error);
                        showStatus(`❌ ${error.message}`, true);
                    });
                },
                onCancel: function(data) {
                    showStatus('❌ El proceso de suscripción fue cancelado.', true);
                    paypalContainer.classList.add('hidden');
                    upgradeLink.classList.remove('hidden');
                },
                onError: function(err) {
                    console.error('Error en PayPal:', err);
                    showStatus('❌ Ocurrió un error al procesar el pago. Intenta nuevamente.', true);
                }
            }).render('#paypal-button-container');
        }

        // ============================================================
        // MEJORAR PLAN (Muestra el botón de PayPal)
        // ============================================================
        function handleUpgrade() {
            if (!authToken) {
                showStatus('⚠️ Inicia sesión para mejorar tu plan', true);
                return;
            }
            if (!currentUser) {
                showStatus('⚠️ No se pudo identificar al usuario', true);
                return;
            }
            if (currentUser.plan === 'premium') {
                showStatus('⚠️ Ya eres Premium', false);
                return;
            }

            // Ocultar el enlace "Mejorar plan" y mostrar el contenedor de PayPal
            upgradeLink.classList.add('hidden');
            paypalContainer.classList.remove('hidden');
            
            // Renderizar el botón solo si el SDK está listo, si no, esperar
            if (payPalReady) {
                renderPayPalButton();
            } else {
                showStatus('⏳ Cargando PayPal, por favor espera...', false);
                // El SDK se cargará y llamará a onPayPalLoaded() que renderizará el botón
            }
        }

        // ============================================================
        // INICIALIZACIÓN (con cambios para evitar errores)
        // ============================================================
        function init() {
            if (authToken) {
                updateUI();
                fetchUsage();
                checkPlanStatus();
            } else {
                updateUI();
            }

            // Event listeners
            loginBtn.addEventListener('click', handleLogin);
            registerBtn.addEventListener('click', handleRegister);
            logoutBtn.addEventListener('click', handleLogout);
            pdfBtn.addEventListener('click', () => handleConvert('pdf'));
            screenshotBtn.addEventListener('click', () => handleConvert('screenshot'));
            upgradeLink.addEventListener('click', handleUpgrade);
            cancelPaypalBtn.addEventListener('click', () => {
                paypalContainer.classList.add('hidden');
                upgradeLink.classList.remove('hidden');
            });

            // ... (resto de event listeners) ...
        }

        // ... (resto del código, incluyendo checkPlanStatus, fetchUsage, etc.) ...
    </script>
</body>
</html>
