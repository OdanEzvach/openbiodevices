<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago exitoso - PDF & Screenshot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            font-size: 2rem;
            color: #0f172a;
            margin-bottom: 0.5rem;
        }
        .success-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        p {
            color: #64748b;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn:hover {
            background: #2563eb;
            transform: scale(1.02);
        }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>¡Pago exitoso!</h1>
        <p>
            Tu plan ha sido actualizado a <strong>Premium</strong>.<br>
            Ahora tienes <strong>100 conversiones</strong> diarias de URLs a PDF o captura de pantalla.
        </p>
        <div class="badge">⭐ Premium activado</div>
        <br><br>
        <a href="index.html" class="btn">Volver a la aplicación</a>
    </div>
</body>
</html>
