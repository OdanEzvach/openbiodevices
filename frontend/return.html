<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago exitoso</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 2rem; background: #f0f4ff; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 2rem; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
        .success { color: #10b981; font-size: 3rem; }
        h1 { color: #0f172a; }
        .btn { display: inline-block; margin-top: 1.5rem; padding: 0.6rem 1.5rem; background: #3b82f6; color: white; text-decoration: none; border-radius: 8px; }
        .btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="success">✅</div>
        <h1>¡Pago completado con éxito!</h1>
        <p>Tu plan ya ha sido actualizado a <strong>Premium</strong>.</p>
        <p>Serás redirigido automáticamente en 3 segundos...</p>
        <a href="/" class="btn">Volver ahora</a>
    </div>

    <script>
        // Redirigir a la página principal después de 3 segundos
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</body>
</html>
